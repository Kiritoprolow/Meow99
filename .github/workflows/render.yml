name: render-video

# Tên run chứa job_id: gateway dùng nó để ánh xạ job_id -> workflow run.
run-name: "video-job ${{ inputs.job_id }} #${{ inputs.attempt }}"

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID job (job_YYYYMMDD_HHMMSS_xxxxxx)"
        required: true
        type: string
      attempt:
        description: "Lần chạy (1 = lần đầu, 2+ = retry)"
        required: false
        default: "1"
        type: string
      project_type:
        description: "video (mặc định, slideshow) | animation_3d (cài Blender). Gateway chỉ gửi input này cho job 3D."
        required: false
        default: "video"
        type: string

permissions:
  contents: read

env:
  # Blender chính thức (LTS) chỉ được tải khi project_type=animation_3d. Hash lấy từ blender.org và đã đối chiếu độc lập.
  BLENDER_VERSION: "5.2.2"
  BLENDER_SHA256: "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168"

concurrency:
  group: render-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-worker.txt

      - name: Kiểm tra đầu vào
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          ATTEMPT: ${{ inputs.attempt }}
          PROJECT_TYPE: ${{ inputs.project_type }}
        run: |
          [[ "$JOB_ID" =~ ^job_[0-9]{8}_[0-9]{6}_[0-9a-f]{6}$ ]] || { echo "job_id không hợp lệ"; exit 1; }
          [[ "$ATTEMPT" =~ ^[1-5]$ ]] || { echo "attempt không hợp lệ"; exit 1; }
          [[ "$PROJECT_TYPE" =~ ^(video|animation_3d)$ ]] || { echo "project_type không hợp lệ"; exit 1; }

      - name: Cài FFmpeg và font Unicode
        timeout-minutes: 8   # job thử nghiệm từng treo ~20 phút ở bước apt (không có log); fail sớm thay vì đứng im
        env:
          PROJECT_TYPE: ${{ inputs.project_type }}
        run: |
          pkgs="ffmpeg fonts-dejavu-core"
          # Thư viện hệ thống cho Blender (EGL/GL cho EEVEE, X11 client libs). Chỉ cài khi là job 3D.
          if [[ "$PROJECT_TYPE" == "animation_3d" ]]; then
            pkgs+=" libegl1 libgl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libsm6 libxkbcommon0 libx11-6"
          fi
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          # DIAG tạm thời: nếu bước này đứng im quá 90s, in tiến trình/khóa đang giữ apt
          ( sleep 90; echo "== STALL DIAG $(date -u +%T) =="; ps -eo pid,etime,stat,args --sort=etime | grep -E 'apt|dpkg|unattended|snap|needrestart' | grep -v grep | cut -c1-160; ls -l /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock 2>&1; sudo fuser -v /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock 2>&1 | head; getent hosts azure.archive.ubuntu.com archive.ubuntu.com | head -3 ) &
          echo "apt update start $(date -u +%T)"
          sudo apt-get $apt_opts update
          echo "apt update done $(date -u +%T)"
          sudo apt-get $apt_opts install -y $pkgs
          echo "apt install done $(date -u +%T)"

      - name: Cài Blender chính thức (chỉ job animation_3d)
        if: inputs.project_type == 'animation_3d'
        shell: bash
        run: |
          # Đo thật trên ubuntu-24.04: tải ~2s, giải nén ~18s => không cần actions/cache (cache tarball 383MB không nhanh hơn tải trực tiếp).
          set -euo pipefail
          dl="$RUNNER_TEMP/blender-dl"; mkdir -p "$dl" "$RUNNER_TEMP/blender"
          curl -fsSL --retry 3 --max-time 600 -o "$dl/blender.tar.xz"             "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "${BLENDER_SHA256}  $dl/blender.tar.xz" | sha256sum -c -
          tar -xf "$dl/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          rm -f "$dl/blender.tar.xz"
          "$RUNNER_TEMP/blender/blender" --version | head -1
          echo "BLENDER_BIN=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"

      - name: Cài thư viện Python
        run: pip install -r requirements-worker.txt

      - name: Render và upload
        env:
          # Giá trị đi qua biến môi trường (không nội suy trực tiếp vào lệnh shell) để tránh script injection.
          JOB_ID: ${{ inputs.job_id }}
          ATTEMPT: ${{ inputs.attempt }}
          STORE_BACKEND: hub
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_STATE_REPO: ${{ vars.HF_STATE_REPO }}
          HF_OUTPUT_REPO: ${{ vars.HF_OUTPUT_REPO }}
          # YouTube (tùy chọn, Giai đoạn 5): thiếu thì job vẫn hoàn tất, YouTube báo pending_configuration.
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m video_engine.run --job-id "$JOB_ID" --attempt "$ATTEMPT"
